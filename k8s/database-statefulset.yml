apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: chat-app
  labels:
    app: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "admin"
              #valueFrom:
                #secretKeyRef:
                  #name: secret-config-file
                  #key:  MONGODB_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: "admin123"
              #valueFrom:
                #secretKeyRef:
                  #name: secret-config-file
                  #key:  MONGODB_PASSWORD
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: mongo-pvc
